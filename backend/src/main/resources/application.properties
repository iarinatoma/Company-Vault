spring.application.name=template

# Local development defaults are prefilled below so the app starts out of the box.
# A git-ignored .env file can still override any value. Replace the secrets before deploying anywhere real.
spring.config.import=optional:file:.env[.properties]

# Virtual threads: blocking JPA/HTTP code is fine as-is; never add custom pools for request work.
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/template
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Liquibase owns the schema; Hibernate only validates it. A mismatch is a startup failure by design.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Context "dev" includes the seeded admin (admin@example.com / Admin-Starter-1); prod switches to "prod".
spring.liquibase.contexts=dev

# List endpoints: capped page size, page envelope serialized as a stable DTO.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Actuator exposes exactly these three — nothing else.
management.endpoints.web.exposure.include=health,info,prometheus

# Every ProblemDetail carries the current traceId; sample everything so it is always there.
management.tracing.sampling.probability=1.0

# Every threshold and TTL binds through AppSecurityProperties — a hard-coded number is a bug.
app.security.jwt.secret=${JWT_SECRET}
# Access TTL is the reaction-time knob for role changes/suspensions — keep it <= 15 minutes.
app.security.jwt.access-ttl=15m
app.security.jwt.two-factor-ttl=5m
app.security.jwt.clock-skew=60s
# The cookie name is the RefreshTokenCookieFactory.COOKIE_NAME constant, not a property.
app.security.refresh-cookie.path=/api/v1/auth
# Lax when frontends are same-site; switching to None (requires Secure) is a conscious config change.
app.security.refresh-cookie.same-site=Lax
app.security.refresh-token.ttl=30d
# Rotated/expired rows are kept this long past expiry for the theft-detection window, then purged.
app.security.refresh-token.purge-grace=7d
app.security.lockout.max-attempts=5
app.security.lockout.duration=15m
app.security.rate-limit.capacity=10
app.security.rate-limit.refill-period=1m
# Explicit origin allowlist — a wildcard is rejected at startup.
app.security.cors.allowed-origins=http://localhost:4200,http://localhost:3000
app.security.encryption.key=${ENCRYPTION_KEY}
