spring.config.import=optional:file:.env-prod[.properties]

# No development seed data in production.
spring.liquibase.contexts=prod

# Structured JSON logs in prod; dev stays human-readable.
logging.structured.format.console=ecs

# springdoc is dev/test only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind the load balancer: honor forwarded headers so rate limiting sees the real client IP.
# Only the trusted proxy's headers must reach the app — enforce that at the LB.
server.forward-headers-strategy=framework
