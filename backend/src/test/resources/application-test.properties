# Test profile: working dummy secrets (never real ones), overridable via git-ignored .env-test.
spring.config.import=optional:file:.env-test[.properties]
app.security.jwt.secret=test-only-jwt-secret-0123456789-0123456789-0123456789
# base64 of 32 bytes — test fixtures only.
app.security.encryption.key=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
# Every integration test shares one client IP; a real-world limit would throttle the suite.
app.security.rate-limit.capacity=10000
# No OTLP collector in test runs — turn span export off entirely.
management.tracing.export.enabled=false
# logging
logging.level.org.dbunit.database.DatabaseConfig=WARN
